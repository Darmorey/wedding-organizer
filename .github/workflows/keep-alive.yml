# Предотвращает паузу Supabase free tier (7 дней без активности)
# После первого деплоя добавьте secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY

name: Supabase keep-alive

on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            || echo "Configure secrets after Supabase setup"
